# Job Requisition Dashboard - Production Docker Compose
# With Traefik reverse proxy for SSL and routing

version: '3.8'

services:
  traefik:
    image: traefik:v3.2
    container_name: job-req-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    networks:
      - job-req-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.yourdomain.com`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: job-req-backend-prod
    restart: unless-stopped
    environment:
      - SQL_SERVER=${SQL_SERVER}
      - SQL_DATABASE_DATALAKE=${SQL_DATABASE_DATALAKE}
      - SQL_DRIVER=${SQL_DRIVER}
      - API_HOST=0.0.0.0
      - API_PORT=8080
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - job-req-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: job-req-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - job-req-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  job-req-network:
    driver: bridge

volumes:
  traefik-certificates:
